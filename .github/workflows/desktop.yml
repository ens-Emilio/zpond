name: Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: "appimage"
          - os: ubuntu-22.04
            bundles: "deb,rpm"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux WebView deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf wget

      - name: Install deps + build hub + dashboard
        run: |
          npm ci
          npm run build --workspace=hub-api
          npm run build --workspace=dashboard
          npm ci --prefix vendor/rea && npm run build:cached --prefix vendor/rea

      - name: Build Tauri bundle (${{ matrix.bundles }})
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "zpond ${{ github.ref_name }}"
          releaseBody: |
            zpond — a lagoa do zfrog (Apache-2.0).

            Linux: AppImage universal (appimage) + .deb (Debian/Ubuntu) / .rpm (Fedora/openSUSE).
            Hub local em :3333 + dashboard — bundle inclui webview, sem Docker.
          releaseDraft: false
          prerelease: false
          projectPath: src-tauri
          args: --bundles ${{ matrix.bundles }} --verbose
